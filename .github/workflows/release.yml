name: "Publish Bliss Guidance: Last.fm"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version/tag. Empty reads LastFmGuidance/install.xml."
        required: false
        default: ""
      native_release:
        description: "bliss-guidance-lastfm release tag. Empty reads LastFmGuidance/Bin/NATIVE_RELEASE."
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as prerelease"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Build packages and upload workflow artifacts only."
        type: boolean
        required: true
        default: false
      update_lms_plugins:
        description: "Update chrober/lms-plugins repo.xml after publishing."
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  NATIVE_REPO: chrober/bliss-guidance-lastfm
  PLUGIN_REPO: chrober/lms-plugins

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run provider contract tests
        run: |
          for test_file in tests/*.t; do
            perl "$test_file"
          done
      - name: Verify no native executable is committed
        run: |
          set -euo pipefail
          if git ls-files 'LastFmGuidance/Bin/*/*' | grep -vE 'LastFmGuidance/Bin/SOURCE.md$' | grep -q .; then
            echo "Native binaries must be release-packaged, not source-controlled." >&2
            exit 1
          fi
      - name: Run feed updater tests
        run: python -m unittest tests/test_update_lms_plugins_repo.py
      - name: Test native source verification
        run: python tests/test_verify_native_source.py

  package-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      linux_url: ${{ steps.meta.outputs.linux_url }}
      mac_url: ${{ steps.meta.outputs.mac_url }}
      windows_url: ${{ steps.meta.outputs.windows_url }}
      linux_sha1: ${{ steps.package.outputs.linux_sha1 }}
      mac_sha1: ${{ steps.package.outputs.mac_sha1 }}
      windows_sha1: ${{ steps.package.outputs.windows_sha1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive release metadata
        id: meta
        env:
          VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          NATIVE_RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.native_release || '' }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("LastFmGuidance/install.xml").getroot().findtext("version"))')"; fi
          fi
          install_version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("LastFmGuidance/install.xml").getroot().findtext("version"))')"
          test "$version" = "$install_version"
          native_release="$NATIVE_RELEASE_INPUT"
          if [ -z "$native_release" ]; then
            native_release="$(tr -d '\r\n' < LastFmGuidance/Bin/NATIVE_RELEASE)"
          fi
          test -n "$native_release"
          tag="v$version"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "native_release=$native_release"
            echo "linux_url=$base_url/lms-guidance-lastfm-linux-$version.zip"
            echo "mac_url=$base_url/lms-guidance-lastfm-mac-$version.zip"
            echo "windows_url=$base_url/lms-guidance-lastfm-windows-$version.zip"
          } >> "$GITHUB_OUTPUT"
      - name: Download native provider assets
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RELEASE: ${{ steps.meta.outputs.native_release }}
        run: |
          set -euo pipefail
          mkdir native-assets
          gh release download "$NATIVE_RELEASE" --repo "$NATIVE_REPO" --dir native-assets --pattern 'bliss-guidance-lastfm-*'
          (cd native-assets && for asset in bliss-guidance-lastfm-aarch64-linux bliss-guidance-lastfm-armhf-linux bliss-guidance-lastfm-x86_64-linux bliss-guidance-lastfm-mac bliss-guidance-lastfm-windows.exe; do sha256sum -c "$asset.sha256"; done)
          (cd native-assets && sha256sum -c bliss-guidance-lastfm-third-party-licenses.zip.sha256)
          git check-ref-format "refs/tags/$NATIVE_RELEASE"
          commit="$(git ls-remote "https://github.com/$NATIVE_REPO.git" "refs/tags/$NATIVE_RELEASE" "refs/tags/$NATIVE_RELEASE^{}" | tail -n 1 | cut -f 1)"
          python scripts/verify_native_source.py native-assets/bliss-guidance-lastfm-source.tar.gz "$commit"
      - name: Build platform plugin archives
        id: package
        env:
          NATIVE_RELEASE: ${{ steps.meta.outputs.native_release }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          mkdir -p dist staging
          install -m 0755 -D native-assets/bliss-guidance-lastfm-aarch64-linux LastFmGuidance/Bin/aarch64-linux/bliss-guidance-lastfm
          install -m 0755 -D native-assets/bliss-guidance-lastfm-armhf-linux LastFmGuidance/Bin/armhf-linux/bliss-guidance-lastfm
          install -m 0755 -D native-assets/bliss-guidance-lastfm-x86_64-linux LastFmGuidance/Bin/x86_64-linux/bliss-guidance-lastfm
          install -m 0755 -D native-assets/bliss-guidance-lastfm-mac LastFmGuidance/Bin/mac/bliss-guidance-lastfm
          install -m 0644 -D native-assets/bliss-guidance-lastfm-windows.exe LastFmGuidance/Bin/windows/bliss-guidance-lastfm.exe
          package_platform() {
            platform="$1"; asset="$2"; rm -rf staging/LastFmGuidance; cp -a LastFmGuidance staging/LastFmGuidance
            cp LICENSE THIRD_PARTY_NOTICES.md staging/LastFmGuidance/
            mkdir -p staging/LastFmGuidance/third-party-licenses
            cp native-assets/bliss-guidance-lastfm-third-party-licenses.zip staging/LastFmGuidance/third-party-licenses/
            printf '# Source provenance\n\nPlugin commit: %s\nhttps://github.com/chrober/lms-guidance-lastfm/tree/%s\n\nNative provider release: %s\nhttps://github.com/chrober/bliss-guidance-lastfm/releases/tag/%s\n\nThese references do not constitute a complete Corresponding Source bundle.\n' "$GITHUB_SHA" "$GITHUB_SHA" "$NATIVE_RELEASE" "$NATIVE_RELEASE" > staging/LastFmGuidance/SOURCE.md
            printf '\nPlugin source archive: https://github.com/chrober/lms-guidance-lastfm/releases/download/%s/lms-guidance-lastfm-source-%s.zip\n' "$RELEASE_TAG" "$RELEASE_VERSION" >> staging/LastFmGuidance/SOURCE.md
            printf 'Native source archive: https://github.com/chrober/bliss-guidance-lastfm/releases/download/%s/bliss-guidance-lastfm-source.tar.gz\n' "$NATIVE_RELEASE" >> staging/LastFmGuidance/SOURCE.md
            cp staging/LastFmGuidance/SOURCE.md staging/LastFmGuidance/Bin/SOURCE.md
            case "$platform" in
              linux) rm -rf staging/LastFmGuidance/Bin/mac staging/LastFmGuidance/Bin/windows ;;
              mac) rm -rf staging/LastFmGuidance/Bin/aarch64-linux staging/LastFmGuidance/Bin/armhf-linux staging/LastFmGuidance/Bin/x86_64-linux staging/LastFmGuidance/Bin/windows ;;
              windows) rm -rf staging/LastFmGuidance/Bin/aarch64-linux staging/LastFmGuidance/Bin/armhf-linux staging/LastFmGuidance/Bin/x86_64-linux staging/LastFmGuidance/Bin/mac ;;
            esac
            (cd staging && zip -q -r "../dist/$asset" LastFmGuidance)
            unzip -tq "dist/$asset" >/dev/null
            unzip -p "dist/$asset" LastFmGuidance/LICENSE | cmp - LICENSE
            unzip -p "dist/$asset" LastFmGuidance/THIRD_PARTY_NOTICES.md | cmp - THIRD_PARTY_NOTICES.md
            unzip -p "dist/$asset" LastFmGuidance/SOURCE.md | grep -F -- "$NATIVE_RELEASE" >/dev/null
          }
          package_platform linux "lms-guidance-lastfm-linux-$version.zip"
          package_platform mac "lms-guidance-lastfm-mac-$version.zip"
          package_platform windows "lms-guidance-lastfm-windows-$version.zip"
          if git ls-tree -r "$GITHUB_SHA" | grep '^160000 ' >/dev/null; then echo 'Submodule source capture is not implemented' >&2; exit 1; fi
          git archive --format=zip --output="dist/lms-guidance-lastfm-source-$version.zip" "$GITHUB_SHA"
          unzip -tq "dist/lms-guidance-lastfm-source-$version.zip" >/dev/null
          for asset in dist/*.zip; do (cd dist && sha1sum "$(basename "$asset")" > "$(basename "$asset").sha1"); (cd dist && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256"); done
          echo "linux_sha1=$(sha1sum "dist/lms-guidance-lastfm-linux-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "mac_sha1=$(sha1sum "dist/lms-guidance-lastfm-mac-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_sha1=$(sha1sum "dist/lms-guidance-lastfm-windows-$version.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lms-guidance-lastfm-${{ steps.meta.outputs.version }}
          path: dist/*
      - name: Publish GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          printf '# Bliss Guidance: Last.fm %s\n\nPlatform-specific Lyrion provider packages.\n' "$VERSION" > release-notes.md
          remote_tag="$(git ls-remote --tags origin "refs/tags/$TAG")"
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" || { echo 'Release tag points to a different source commit' >&2; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG; refusing to overwrite assets" >&2; exit 1
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Bliss Guidance: Last.fm $VERSION" --notes-file release-notes.md
          fi
      - name: Update extension feed
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          path: lms-plugins
          token: ${{ secrets.LMS_PLUGINS_TOKEN || secrets.MS_PLUGINS_TOKEN }}
      - name: Write and publish extension feed entry
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LINUX_URL: ${{ steps.meta.outputs.linux_url }}
          MAC_URL: ${{ steps.meta.outputs.mac_url }}
          WINDOWS_URL: ${{ steps.meta.outputs.windows_url }}
          LINUX_SHA: ${{ steps.package.outputs.linux_sha1 }}
          MAC_SHA: ${{ steps.package.outputs.mac_sha1 }}
          WINDOWS_SHA: ${{ steps.package.outputs.windows_sha1 }}
        run: |
          set -euo pipefail
          python scripts/update_lms_plugins_repo.py --repo-xml lms-plugins/repo.xml --version "$VERSION" --linux-url "$LINUX_URL" --linux-sha "$LINUX_SHA" --mac-url "$MAC_URL" --mac-sha "$MAC_SHA" --windows-url "$WINDOWS_URL" --windows-sha "$WINDOWS_SHA"
          python -c "import xml.etree.ElementTree as ET; ET.parse('lms-plugins/repo.xml')"
          cd lms-plugins
          if ! git diff --quiet -- repo.xml; then git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add repo.xml; git commit -m "Publish Bliss Guidance: Last.fm $VERSION"; git push; fi
